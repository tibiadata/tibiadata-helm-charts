# Default values for tibiadata-api-go.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 3

image:
  repository: ghcr.io/tibiadata/tibiadata-api-go
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion (digest takes precedence over tag).
  tag: ""
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

configMap:
  create: true
  settings:
    # Generic settings
    DEBUG_MODE: false
    # Gin-related settings
    GIN_MODE: release
    GIN_TRUSTED_PROXIES: ""
    # TibiaData-related settings
    TIBIADATA_EDITION: open-source
    TIBIADATA_HOST: undefined
    TIBIADATA_RESTRICTION_MODE: false

env: []

# Reference a Kubernetes Secret containing sensitive values the app needs (e.g. an API
# token such as TIBIA_FANSITEAPI_TOKEN). By default (secret.create: false) this chart never
# creates or manages the Secret's contents -- create/populate it out-of-band (kubectl, GitOps +
# sealed-secrets/SOPS, external-secrets, etc.) before installing/upgrading the release with
# this enabled.
secret:
  enabled: false
  # Name of the Secret in the same namespace as the release (pre-existing, or to be created --
  # see secret.create below).
  name: ""
  # If true, the chart creates the Secret when it doesn't already exist yet, seeded with empty
  # placeholder values for each key in secret.keys -- so the release can install successfully
  # without a separate manual `kubectl create secret` step. It never overwrites an existing
  # Secret's data on subsequent upgrades, and the Secret is annotated with
  # "helm.sh/resource-policy: keep" so it survives `helm uninstall`. You still need to populate
  # the real value(s) yourself, e.g. `kubectl edit secret <name>`.
  create: false
  # Key names to seed as empty placeholders when secret.create creates a new Secret. Only used
  # on first creation; ignored once the Secret already exists.
  keys:
    []
    # - TIBIA_FANSITEAPI_TOKEN
  # Optional list of secret keys to expose as explicit environment variables.
  # If left empty, all keys in the Secret are loaded automatically via envFrom.
  env:
    []
    # - name: TIBIA_FANSITEAPI_TOKEN
    #   key: TIBIA_FANSITEAPI_TOKEN

podAnnotations: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsUser: 1001
  runAsGroup: 1001
  runAsNonRoot: true

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: tibiadata-api-go.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: tibiadata-api-go-tls
  #    hosts:
  #      - tibiadata-api-go.local

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 25
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
