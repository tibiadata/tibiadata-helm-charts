{{- if and .Values.secret.enabled .Values.secret.create }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.secret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    {{- include "tibiadata-api-go.labels" . | nindent 4 }}
  annotations:
    # Never let helm delete this Secret (e.g. on `helm uninstall`, or if secret.create is later
    # disabled) once it may hold real, manually-populated values.
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- if $existing }}
  {{- /* Secret already exists: re-emit its current data untouched so `helm upgrade` never
         overwrites values a human has since populated, e.g. via `kubectl edit secret`. */}}
  {{- range $key, $value := $existing.data }}
  {{ $key }}: {{ $value }}
  {{- end }}
  {{- else }}
  {{- /* First creation: seed empty placeholders so the Secret exists and env/envFrom refs
         resolve, without the chart ever holding a real secret value. */}}
  {{- range .Values.secret.keys }}
  {{ . }}: ""
  {{- end }}
  {{- end }}
{{- end }}
